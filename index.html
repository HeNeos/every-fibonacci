<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>(Almost) Every Fibonacci Number</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>(Almost) Every Fibonacci Number</h1>
    <p>Scroll through the Fibonacci sequence. (Last 16 digits shown)</p>
    <div class="search-container">
      <input type="text" id="jumpToInput" placeholder="Jump to index (up to, 2.21e48)..." />
      <button id="jumpToBtn">Go</button>
    </div>
  </header>
  <div id="current-info">
    <span id="currentInfo">Fibonacci #0: ...</span>
  </div>
  <div id="viewport">
    <div id="scrollableDiv">
      <div id="scrollHeight"></div>
      <div id="fibonacci-container"></div>
    </div>
  </div>
  <div class="side-panel">
    <button id="panel-up" class="panel-btn" aria-label="Scroll up">
      ▲
    </button>
    <button id="panel-down" class="panel-btn" aria-label="Scroll down">
      ▼
    </button>
  </div>
  <footer>
    <p>
      Powered by WebAssembly + Rust |
      <a href="https://github.com/HeNeos/every-fibonacci" target="_blank">GitHub</a>
    </p>
    <button id="theme-toggle">Toggle Theme</button>
  </footer>

  <script type="module">
    import init, {
      init_pair,
      next_pair,
      prev_pair,
      get_current_index,
    } from "./pkg/fibonacci_generator.js";

    async function run() {
      try {
        await init();

        const SCROLL_HEIGHT = 1000000;
        // Fib(Fib(Fib(7))) ~ 2^160.597 ~ 10^48.3446
        const MAX_DISPLAY_INDEX = 2211236406303914545699412969744873993387956988653n;
        const PISANO_PERIOD_10_16 = 15n * 10n ** 15n;
        const ITEM_HEIGHT = 30;
        const calculateVisibleItems = () =>
          Math.ceil(window.innerHeight / ITEM_HEIGHT) + 6;
        let VISIBLE_ITEMS = calculateVisibleItems();
        const DIGIT_COUNT = 16;
        const MODULO_BIGINT = 10n ** 16n;
        const SPACEBAR_SCROLL_LINES = 10;
        const TOUCH_STEP_THRESHOLD = ITEM_HEIGHT * 0.7;
        const TOUCH_MOVE_INTERVAL_MS = 100;
        const SCROLL_UPDATE_THRESHOLD = 16n;
        const SCROLL_THROTTLE_MS = 3;

        const scrollableDiv = document.getElementById("scrollableDiv");
        const scrollHeightDiv = document.getElementById("scrollHeight");
        const primesContainer = document.getElementById("fibonacci-container");
        const currentInfo = document.getElementById("currentInfo");
        const jumpToInput = document.getElementById("jumpToInput");
        const jumpToBtn = document.getElementById("jumpToBtn");
        const viewport = document.getElementById("viewport");
        const themeToggleBtn = document.getElementById("theme-toggle");
        const panelUp = document.getElementById("panel-up");
        const panelDown = document.getElementById("panel-down");

        let currentIndex = 0n;
        let currentFibPairBigInt = [0n, 1n];
        let isDraggingScrollbar = false;
        let isTouching = false;
        let isTouchScrolling = false;
        let touchStartY = 0;
        let isProcessingStep = false;
        let scrollThrottleTimeout = null;
        let isJumping = false;

        scrollHeightDiv.style.height = `${SCROLL_HEIGHT}px`;

        function attachPanelButton(btn, dir) {
          let intervalId = null;
          btn.addEventListener(
            "pointerdown",
            (e) => {
              if (e.pointerType !== "touch" && e.pointerType !== "mouse")
                return;
              handleStepScroll(dir);
              intervalId = setInterval(
                () => handleStepScroll(dir),
                TOUCH_MOVE_INTERVAL_MS
              );
              e.preventDefault();
            },
            { passive: false }
          );
          ["pointerup", "pointerleave", "pointercancel"].forEach((evt) =>
            btn.addEventListener(evt, () => {
              if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
              }
            })
          );
        }
        attachPanelButton(panelUp, -1);
        attachPanelButton(panelDown, 1);

        function applyTheme(theme) {
          if (theme === "dark") {
            document.body.classList.add("dark-mode");
            localStorage.setItem("fibTheme", "dark");
          } else {
            document.body.classList.remove("dark-mode");
            localStorage.setItem("fibTheme", "light");
          }
        }
        themeToggleBtn.addEventListener("click", () => {
          const currentTheme = document.body.classList.contains("dark-mode")
            ? "dark"
            : "light";
          applyTheme(currentTheme === "dark" ? "light" : "dark");
        });
        const savedTheme = localStorage.getItem("fibTheme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (savedTheme) {
          applyTheme(savedTheme);
        } else {
          applyTheme(prefersDark ? "dark" : "light");
        }

        function scrollToIndex(scrollPos) {
          scrollPos = Math.max(0, Math.min(SCROLL_HEIGHT, scrollPos));
          if (scrollPos <= 0) return 0n;
          if (scrollPos >= SCROLL_HEIGHT) return MAX_DISPLAY_INDEX;
          const scrollPosBigInt = BigInt(Math.round(scrollPos));
          const scrollHeightBigInt = BigInt(SCROLL_HEIGHT);
          const index = (scrollPosBigInt * MAX_DISPLAY_INDEX) / scrollHeightBigInt;
          return index < MAX_DISPLAY_INDEX ? index : MAX_DISPLAY_INDEX;
        }

        function indexToScroll(index) {
          if (typeof index !== "bigint") index = BigInt(index);
          if (index <= 0n) return 0;
          if (index >= MAX_DISPLAY_INDEX) return SCROLL_HEIGHT;
          const scrollHeightBigInt = BigInt(SCROLL_HEIGHT);
          const scrollPosBigInt = (index * scrollHeightBigInt) / MAX_DISPLAY_INDEX;
          return Number(scrollPosBigInt);
        }

        function formatFibNumber(numBigInt) {
          const numStr = (numBigInt % MODULO_BIGINT).toString();
          if (numStr.length >= DIGIT_COUNT) return numStr;
          const zerosNeeded = DIGIT_COUNT - numStr.length;
          const zeros = "0".repeat(zerosNeeded);
          return `<span class="leading-zeros">${zeros}</span>${numStr}`;
        }

        function renderVisibleWindow(displayStartIndex, startFibN_BigInt, startFibNm1_BigInt) {
          try {
            displayStartIndex = displayStartIndex < 0n ? 0n : displayStartIndex;
            displayStartIndex = displayStartIndex > MAX_DISPLAY_INDEX ? MAX_DISPLAY_INDEX : displayStartIndex;

            primesContainer.innerHTML = "";
            let fib_k = startFibN_BigInt;
            let fib_km1 = startFibNm1_BigInt;

            if (displayStartIndex === 0n) {
              fib_k = 0n;
              fib_km1 = 1n;
            }

            const baseScrollTop = indexToScroll(displayStartIndex);

            for (let i = 0; i < VISIBLE_ITEMS; i++) {
              const currentDisplayIndex = displayStartIndex + BigInt(i);
              if (currentDisplayIndex > MAX_DISPLAY_INDEX) break;

              let displayValue;
              if (i === 0 && displayStartIndex === 0n) {
                displayValue = 0n;
              } else if (i === 0) {
                displayValue = fib_k;
              } else {
                const nextFib = (fib_k + fib_km1) % MODULO_BIGINT;
                fib_km1 = fib_k;
                fib_k = nextFib;
                displayValue = fib_k;
              }

              const indexStr = currentDisplayIndex.toString();
              const el = document.createElement("div");
              el.className = "fibonacci-item";
              el.style.position = "absolute";
              el.style.left = "0";
              el.style.right = "0";
              el.style.height = `${ITEM_HEIGHT}px`;
              el.style.transform = `translateY(${baseScrollTop + i * ITEM_HEIGHT}px)`;
              el.innerHTML = `<span class="index">Fib(${indexStr})</span> <span class="fibonacci-value">${formatFibNumber(displayValue)}</span>`;
              primesContainer.appendChild(el);
            }
            updateCurrentInfo(displayStartIndex, (displayStartIndex === 0n) ? 0n : startFibN_BigInt);

            if (!isDraggingScrollbar && !isTouching && !isProcessingStep && !isJumping) {
              const targetScrollTop = indexToScroll(displayStartIndex);
              if (Math.abs(scrollableDiv.scrollTop - targetScrollTop) > ITEM_HEIGHT / 2) {
                scrollableDiv.scrollTop = targetScrollTop;
              }
            }
          } catch (e) {
            console.error("Error during rendering:", e);
            currentInfo.innerHTML = `<span style="color: red;">Render Error</span>`;
          }
        }

        function updateCurrentInfo(displayIndex, valueBigInt) {
          currentInfo.innerHTML = `Fib(${displayIndex.toString()}): ${formatFibNumber(valueBigInt)}`;
        }

        window.addEventListener("resize", () => {
          VISIBLE_ITEMS = calculateVisibleItems();
          renderVisibleWindow(currentIndex, currentFibPairBigInt[0], currentFibPairBigInt[1]);
        });

        scrollableDiv.addEventListener("mousedown", (e) => {
          if (e.offsetX >= scrollableDiv.clientWidth) {
            isDraggingScrollbar = true;
            clearTimeout(scrollThrottleTimeout);
          }
        });

        window.addEventListener("mouseup", () => {
          if (isDraggingScrollbar) {
            isDraggingScrollbar = false;
          }
        });

        scrollableDiv.addEventListener("scroll", () => {
          if (isProcessingStep || isJumping) {
            return;
          }

          clearTimeout(scrollThrottleTimeout);
          scrollThrottleTimeout = setTimeout(() => {
            if (isJumping) {
              return;
            }

            const targetDisplayIndex = scrollToIndex(scrollableDiv.scrollTop);
            const indexDiff = currentIndex > targetDisplayIndex
              ? currentIndex - targetDisplayIndex
              : targetDisplayIndex - currentIndex;

            if (indexDiff >= SCROLL_UPDATE_THRESHOLD) {
              try {
                const wasmIndex = targetDisplayIndex % PISANO_PERIOD_10_16 + PISANO_PERIOD_10_16;
                const pairStrings = init_pair(wasmIndex);
                const pairBigInt = [BigInt(pairStrings[0]), BigInt(pairStrings[1])];

                currentIndex = targetDisplayIndex;
                currentFibPairBigInt = pairBigInt;

                renderVisibleWindow(currentIndex, currentFibPairBigInt[0], currentFibPairBigInt[1]);
              } catch (e) {
                console.error("Error init_pair on scroll:", e);
                currentInfo.innerHTML = `<span style="color: red;">Calc Error</span>`;
              }
            }
          }, SCROLL_THROTTLE_MS);
        });

        async function handleStepScroll(direction) {
          if (isProcessingStep || isJumping) return;

          const targetDisplayIndex = currentIndex + BigInt(direction);
          if (targetDisplayIndex < 0n || targetDisplayIndex > MAX_DISPLAY_INDEX) {
            return;
          }

          isProcessingStep = true;
          isTouchScrolling = false;

          try {
            let newPairStrings;
            if (direction === 1) {
              newPairStrings = next_pair();
            } else {
              newPairStrings = prev_pair();
            }
            const newPairBigInt = [BigInt(newPairStrings[0]), BigInt(newPairStrings[1])];

            currentIndex = targetDisplayIndex;
            currentFibPairBigInt = newPairBigInt;

            renderVisibleWindow(currentIndex, currentFibPairBigInt[0], currentFibPairBigInt[1]);

            if (!isDraggingScrollbar && !isTouching) {
              scrollableDiv.scrollTop = indexToScroll(currentIndex);
            }
          } catch (e) {
            console.error(`Error during step ${direction}:`, e);
            try {
              const wasmIndex = currentIndex % PISANO_PERIOD_10_16 + PISANO_PERIOD_10_16;
              const pairStrings = init_pair(wasmIndex);
              currentFibPairBigInt = [BigInt(pairStrings[0]), BigInt(pairStrings[1])];
              renderVisibleWindow(currentIndex, currentFibPairBigInt[0], currentFibPairBigInt[1]);
            } catch (syncErr) {
              console.error("Failed to re-sync state after step error:", syncErr);
            }
          } finally {
            requestAnimationFrame(() => { 
              isProcessingStep = false; 
            });
          }
        }

        scrollableDiv.addEventListener("touchstart", (event) => {
          if (isDraggingScrollbar) return;
          if (event.touches.length === 1) {
            isTouching = true;
            isTouchScrolling = false;
            touchStartY = event.touches[0].clientY;
            clearTimeout(scrollThrottleTimeout);
          }
        }, { passive: true });

        scrollableDiv.addEventListener("touchmove", (event) => {
          if (!isTouching || event.touches.length !== 1) return;

          const currentTouchY = event.touches[0].clientY;
          const deltaY = currentTouchY - touchStartY;

          if (Math.abs(deltaY) > TOUCH_STEP_THRESHOLD && !isProcessingStep) {
            event.preventDefault();
            const direction = deltaY > 0 ? -1 : 1;
            handleStepScroll(direction);
            touchStartY = currentTouchY;
          } else if (!isProcessingStep) {
            isTouchScrolling = true;
          }
        }, { passive: false });

        scrollableDiv.addEventListener("touchend", () => {
          if(isTouching){
            isTouching = false;
            isTouchScrolling = false;
          }
        });

        scrollableDiv.addEventListener("touchcancel", () => {
          if(isTouching){
            isTouching = false;
            isTouchScrolling = false;
          }
        });

        scrollableDiv.addEventListener("wheel", (event) => {
          if (isTouching || isDraggingScrollbar || isJumping) return;
          event.preventDefault();
          const direction = event.deltaY > 0 ? 1 : -1;
          handleStepScroll(direction);
        }, { passive: false });

        function handleJump() {
          const indexStr = jumpToInput.value.trim().replace(/_/g, "");
          if (!indexStr) return;

          try {
            let targetDisplayIndex = BigInt(indexStr);
            if (targetDisplayIndex < 0n) targetDisplayIndex = 0n;
            if (targetDisplayIndex > MAX_DISPLAY_INDEX) targetDisplayIndex = MAX_DISPLAY_INDEX;

            isJumping = true;

            const wasmIndex = targetDisplayIndex % PISANO_PERIOD_10_16 + PISANO_PERIOD_10_16;
            const pairStrings = init_pair(wasmIndex);
            const pairBigInt = [BigInt(pairStrings[0]), BigInt(pairStrings[1])];

            currentIndex = targetDisplayIndex;
            currentFibPairBigInt = pairBigInt;

            isDraggingScrollbar = false;
            isTouching = false;
            isTouchScrolling = false;
            scrollableDiv.scrollTop = indexToScroll(currentIndex);
            renderVisibleWindow(currentIndex, currentFibPairBigInt[0], currentFibPairBigInt[1]);

            jumpToInput.value = "";
            jumpToInput.blur();
          } catch (e) {
            alert(`Error jumping: Invalid input or calculation error`);
            console.error("Jump error:", e);
          } finally {
            setTimeout(() => { isJumping = false; }, 100);
          }
        }

        jumpToBtn.addEventListener("click", handleJump);
        jumpToInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") handleJump();
        });

        window.addEventListener("keydown", (event) => {
          if (event.target === jumpToInput || event.metaKey || event.ctrlKey) return;

          if (event.code === 'Space' || event.key === ' ') {
            event.preventDefault();
            let steps = 0;
            const scrollInterval = setInterval(() => {
              if (steps >= SPACEBAR_SCROLL_LINES || currentIndex >= MAX_DISPLAY_INDEX) {
                clearInterval(scrollInterval);
                return;
              }
              handleStepScroll(1);
              steps++;
            }, 60);
            return;
          } else if (event.key === 'ArrowDown' || event.key === 'PageDown') {
            event.preventDefault();
            const multiplier = event.key === 'PageDown' ? Math.max(1, Math.floor(VISIBLE_ITEMS / 2)) : 1;
            handleStepScroll(multiplier);
          } else if (event.key === 'ArrowUp' || event.key === 'PageUp') {
            event.preventDefault();
            const multiplier = event.key === 'PageUp' ? Math.max(1, Math.floor(VISIBLE_ITEMS / 2)) : 1;
            handleStepScroll(-multiplier);
          }
        });

        // Initialize display with F(0)
        console.log("Initializing at index 0");
        try {
          const initialDisplayIndex = 0n;
          const initialWasmIndex = initialDisplayIndex % PISANO_PERIOD_10_16 + PISANO_PERIOD_10_16;
          const initialPairStrings = init_pair(initialWasmIndex);
          const initialPairBigInt = [BigInt(initialPairStrings[0]), BigInt(initialPairStrings[1])];

          currentIndex = initialDisplayIndex;
          currentFibPairBigInt = initialPairBigInt;
          scrollableDiv.scrollTop = indexToScroll(currentIndex);
          renderVisibleWindow(currentIndex, currentFibPairBigInt[0], currentFibPairBigInt[1]);
        } catch (e) {
          console.error("Initial load error:", e);
          document.body.innerHTML = `<div class="error">Failed to initialize: ${e}</div>`;
        }
      } catch (error) {
        console.error("Initialization failed:", error);
        document.body.innerHTML = `<div class="error">Failed to initialize WebAssembly module: ${error}</div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", run);
  </script>
</body>

</html>
